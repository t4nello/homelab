{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "adguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "adguard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "adguard.ingressHost" . }}
      http:
        paths:
          - path: /control/install
            pathType: Prefix
            backend:
              service:
                name: {{ include "adguard.fullname" . }}-setup
                port:
                  number: {{ .Values.service.setupPort }}
          - path: /install
            pathType: Prefix
            backend:
              service:
                name: {{ include "adguard.fullname" . }}-setup
                port:
                  number: {{ .Values.service.setupPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "adguard.fullname" . }}
                port:
                  number: {{ .Values.service.webPort }}
{{- end }}
