{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ .Values.secret.values.APP_KEY | quote }}
  DB_PASSWORD: {{ .Values.secret.values.DB_PASSWORD | quote }}
{{- end }}
