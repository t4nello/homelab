replicaCount: 1

image:
  repository: lscr.io/linuxserver/bookstack
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  host: ""
  subdomain: wiki
  domain: tanello.site

secret:
  existingSecret: ""
  name: bookstack-config
  values:
    APP_KEY: ""
    DB_PASSWORD: ""

env:
  APP_URL: ""
  DB_HOST: mysql.database.svc.cluster.local
  DB_PORT: "3306"
  DB_DATABASE: bookstack_db
  DB_USERNAME: bookstack_user

persistence:
  enabled: true
  existingClaim: ""
  claimName: bookstack-config
  volumeName: bookstack-config
  storageClassName: bookstack-local
  accessMode: ReadWriteOnce
  size: 10Gi
  reclaimPolicy: Retain
  hostPath: /srv/k3s/applications/bookstack
  hostPathType: DirectoryOrCreate
  mountPath: /config

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
