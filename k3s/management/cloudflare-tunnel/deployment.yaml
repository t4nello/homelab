apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-deployment
  namespace: management
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      pod: cloudflared
  template:
    metadata:
      labels:
        pod: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          args:
            - tunnel
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: CLOUDFLARED_TUNNEL_TOKEN
                  
            - name: TUNNEL_LOGLEVEL
              value: info
            - name: TUNNEL_METRICS
              value: "0.0.0.0:60123"
          ports:
            - name: metrics
              containerPort: 60123
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10