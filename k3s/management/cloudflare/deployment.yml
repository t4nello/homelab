apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: CLOUDFLARED_TUNNEL_TOKEN
