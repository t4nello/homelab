apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - cloudflare-tunnel
  - traefik

configMapGenerator:
  - name: host-config
    namespace: management
    envs:
      - envs/hosts.env

secretGenerator:
  - name: api-keys
    namespace: management
    envs:
      - envs/.api_keys.env

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: host-config
      fieldPath: data.TRAEFIK_HOST
    targets:
      - select:
          kind: IngressRoute
          name: traefik-dashboard
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1