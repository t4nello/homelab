apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: management
resources:
  - ingress.yaml
  - middleware.yaml
  - helmchartconfig.yaml

secretGenerator:
  - name: traefik-dashboard-auth
    namespace: management
    files:
      - users=usersfile

generatorOptions:
  disableNameSuffixHash: true