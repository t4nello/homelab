apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - deployment.yaml
  - service.yaml
  - storage.yaml
  - ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: watchyourlan-config
    envs:
      - envs/values.env

replacements:
  - source:
      kind: ConfigMap
      name: watchyourlan-config
      fieldPath: data.APP_HOST
    targets:
      - select:
          kind: Ingress
          name: watchyourlan
        fieldPaths:
          - spec.rules.0.host
