apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portainer

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - pvc.yaml
  - rbac.yaml

configMapGenerator:
  - name: portainer-host-config
    envs:
      - envs/hosts.env

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: portainer-host-config
      fieldPath: data.PORTAINER_HOST
    targets:
      - select:
          kind: IngressRoute
          name: portainer
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
